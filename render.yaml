services:
  - type: web
    name: mental-health-ai-backend
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --access-log --log-level info
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false  # Set this in Render dashboard - REQUIRED
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: CORS_ORIGINS
        value: https://mental-health-ai-backend-suggestion.onrender.com
      - key: MAX_UPLOAD_SIZE
        value: "10485760"  # 10MB
      - key: RATE_LIMIT_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW
        value: "3600"
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
    # Optional: ChromaDB Cloud configuration (for better performance)
    # Uncomment and set these in Render dashboard if you have ChromaDB Cloud
    # - key: CHROMA_CLIENT_AUTH_TOKEN
    #   sync: false
    # - key: CHROMA_SERVER_HOST
    #   value: api.trychroma.com
